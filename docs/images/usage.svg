<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-label="GitHub CLI App 使用方式：面板点按钮 或 对话让助手调工具">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf6"/>
      <stop offset="1" stop-color="#f6ede2"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a332c"/>
      <stop offset="1" stop-color="#1e1a16"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#5a4632" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1240" height="720" fill="url(#bg)"/>

  <text x="48" y="60" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="600" fill="#2f2a24">GitHub CLI App · 怎么用</text>
  <text x="48" y="88" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="15" fill="#8d8274">两条路：装好后点面板按钮做设置；日常操作直接跟助手说需求</text>

  <!-- ============ 起点：安装 + 登录 ============ -->
  <g transform="translate(48 124)">
    <rect x="0" y="0" width="1144" height="104" rx="16" fill="#ffffff" stroke="#e8dccc" filter="url(#soft)"/>
    <!-- 品牌方块 -->
    <g transform="translate(30 30)">
      <rect x="0" y="0" width="44" height="44" rx="13" fill="url(#tile)"/>
      <g transform="translate(22 22) scale(2.4) translate(-8 -8)">
        <path fill="#fdfaf6" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63 0 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </g>
    </g>
    <text x="96" y="40" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="15" font-weight="600" fill="#2f2a24">准备工作（只做一次）</text>
    <text x="96" y="66" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13.5" fill="#6f6659">打开面板 → 点「一键安装」（弹 UAC 点是） → 点「登录」→ 复制一次性代码 → 浏览器授权</text>

    <!-- 步骤小圆点 -->
    <g transform="translate(96 82)">
      <circle cx="6" cy="6" r="6" fill="#c2703d"/><text x="6" y="10" text-anchor="middle" font-size="8" fill="#fff" font-family="system-ui">1</text>
      <text x="18" y="10" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12" fill="#8d8274">安装</text>
      <circle cx="86" cy="6" r="6" fill="#c2703d"/><text x="86" y="10" text-anchor="middle" font-size="8" fill="#fff" font-family="system-ui">2</text>
      <text x="98" y="10" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12" fill="#8d8274">登录</text>
      <circle cx="166" cy="6" r="6" fill="#3d9a63"/><text x="166" y="10" text-anchor="middle" font-size="8" fill="#fff" font-family="system-ui">3</text>
      <text x="178" y="10" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12" fill="#8d8274">面板变绿，开用</text>
    </g>

    <!-- 箭头 -->
    <g transform="translate(1060 34)">
      <path d="M0 18 L0 46" stroke="#c2703d" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M-7 40 L0 48 L7 40" stroke="#c2703d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ============ 分岔标题 ============ -->
  <text x="48" y="278" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" font-weight="600" fill="#8d8274">之后，按场景选一条路</text>

  <!-- 左：面板 -->
  <g transform="translate(48 298)">
    <rect x="0" y="0" width="548" height="374" rx="16" fill="#ffffff" stroke="#e8dccc" filter="url(#soft)"/>
    <!-- 标题条 -->
    <rect x="0" y="0" width="548" height="52" rx="16" fill="#fbf4ea"/>
    <rect x="0" y="36" width="548" height="16" fill="#fbf4ea"/>
    <text x="26" y="33" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="15" font-weight="600" fill="#b0653a">路 A · 点面板按钮</text>
    <text x="430" y="33" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12" fill="#a89c8c">适合一次性设置</text>

    <!-- 面板示意 -->
    <g transform="translate(26 76)">
      <rect x="0" y="0" width="496" height="270" rx="12" fill="#fdfaf6" stroke="#ece0d0"/>
      <!-- 头部 -->
      <g transform="translate(20 20)">
        <rect x="0" y="0" width="26" height="26" rx="8" fill="url(#tile)"/>
        <g transform="translate(13 13) scale(1.5) translate(-8 -8)"><path fill="#fdfaf6" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63 0 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></g>
        <text x="36" y="12" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="13" font-weight="600" fill="#2f2a24">GitHub CLI</text>
        <circle cx="40" cy="22" r="3.4" fill="#3d9a63"/>
        <text x="48" y="25" font-family="system-ui" font-size="10" fill="#8d8274">已就绪 · v0.2.8</text>
      </g>
      <!-- 卡 1 -->
      <g transform="translate(20 62)">
        <rect x="0" y="0" width="456" height="58" rx="10" fill="#ffffff" stroke="#ece0d0"/>
        <text x="16" y="24" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12.5" font-weight="600" fill="#2f2a24">命令行工具 gh</text>
        <text x="16" y="42" font-family="system-ui" font-size="11" fill="#8d8274">已安装 · 2.101.0</text>
        <rect x="236" y="17" width="58" height="26" rx="8" fill="#c2703d"/>
        <text x="265" y="34" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="11.5" fill="#fff">升级</text>
        <rect x="302" y="17" width="58" height="26" rx="8" fill="none" stroke="#d9c6ae"/>
        <text x="331" y="34" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="11.5" fill="#8d8274">重装</text>
        <rect x="368" y="17" width="58" height="26" rx="8" fill="none" stroke="#d9a9a3"/>
        <text x="397" y="34" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="11.5" fill="#b8544a">卸载</text>
      </g>
      <!-- 卡 2 -->
      <g transform="translate(20 132)">
        <rect x="0" y="0" width="456" height="58" rx="10" fill="#ffffff" stroke="#ece0d0"/>
        <text x="16" y="24" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12.5" font-weight="600" fill="#2f2a24">GitHub 账号</text>
        <text x="16" y="42" font-family="system-ui" font-size="11" fill="#8d8274">hayou2002 @ github.com</text>
        <rect x="368" y="17" width="58" height="26" rx="8" fill="none" stroke="#d9a9a3"/>
        <text x="397" y="34" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="11.5" fill="#b8544a">退出登录</text>
      </g>
      <!-- 一次性代码示意 -->
      <g transform="translate(20 202)">
        <text x="0" y="12" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="11.5" fill="#8d8274">一次性代码</text>
        <rect x="78" y="-4" width="120" height="28" rx="8" fill="#fbf1e6" stroke="#c2703d" stroke-dasharray="5 4"/>
        <text x="138" y="15" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#2f2a24">5F11-A23C</text>
        <text x="206" y="15" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="11" fill="#c2703d">点击复制 →</text>
      </g>
    </g>
    <text x="26" y="360" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12" fill="#a89c8c">装 / 卸 / 升级 / 登录 / 退出，看得见状态、点得动</text>
  </g>

  <!-- 右：对话 -->
  <g transform="translate(644 298)">
    <rect x="0" y="0" width="548" height="374" rx="16" fill="#ffffff" stroke="#e8dccc" filter="url(#soft)"/>
    <rect x="0" y="0" width="548" height="52" rx="16" fill="#f0f4ef"/>
    <rect x="0" y="36" width="548" height="16" fill="#f0f4ef"/>
    <text x="26" y="33" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="15" font-weight="600" fill="#3c7e78">路 B · 直接跟助手说</text>
    <text x="418" y="33" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12" fill="#a89c8c">适合日常批量操作</text>

    <g transform="translate(26 76)">
      <!-- 你说的气泡 -->
      <g transform="translate(150 0)">
        <rect x="0" y="0" width="346" height="34" rx="12" fill="#f6ede2"/>
        <text x="16" y="22" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12.5" fill="#2f2a24">「看看我的 GitHub 登录状态」</text>
      </g>
      <g transform="translate(150 42)">
        <rect x="0" y="0" width="346" height="34" rx="12" fill="#f6ede2"/>
        <text x="16" y="22" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12.5" fill="#2f2a24">「列出我最近的 20 个仓库」</text>
      </g>
      <g transform="translate(150 84)">
        <rect x="0" y="0" width="346" height="34" rx="12" fill="#f6ede2"/>
        <text x="16" y="22" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12.5" fill="#2f2a24">「给 owner/repo 提一个 issue」</text>
      </g>
      <!-- 助手回执 -->
      <g transform="translate(150 138)">
        <rect x="0" y="0" width="346" height="88" rx="12" fill="#ffffff" stroke="#e6ded0"/>
        <text x="16" y="24" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="11.5" font-weight="600" fill="#3c7e78">助手调用工具后回执</text>
        <text x="16" y="46" font-family="Consolas, monospace" font-size="11" fill="#6f6659">github_cli_status → ✓ 已登录</text>
        <text x="16" y="64" font-family="Consolas, monospace" font-size="11" fill="#6f6659">github_cli_run    → 20 个仓库</text>
        <text x="16" y="82" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="11" fill="#a89c8c">写操作会先报参数，你确认后才执行</text>
      </g>
      <!-- 左侧五个工具名 -->
      <g transform="translate(0 8)">
        <text x="0" y="12" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="11" fill="#a89c8c">五个工具</text>
        <text x="0" y="40" font-family="Consolas, monospace" font-size="10.5" fill="#6f6659">status</text>
        <text x="0" y="62" font-family="Consolas, monospace" font-size="10.5" fill="#6f6659">run</text>
        <text x="0" y="84" font-family="Consolas, monospace" font-size="10.5" fill="#6f6659">install</text>
        <text x="0" y="106" font-family="Consolas, monospace" font-size="10.5" fill="#6f6659">login</text>
        <text x="0" y="128" font-family="Consolas, monospace" font-size="10.5" fill="#6f6659">logout</text>
      </g>
    </g>
    <text x="26" y="360" font-family="'Segoe UI','Microsoft YaHei',system-ui" font-size="12" fill="#a89c8c">助手自己选工具、接着做下一步，适合串起后续动作</text>
  </g>
</svg>
