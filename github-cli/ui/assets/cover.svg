<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GitHub CLI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbf8"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a332c"/>
      <stop offset="1" stop-color="#1e1a16"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#5a4632" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 背景装饰：极淡的暖色圆 -->
  <circle cx="430" cy="80" r="116" fill="#c2703d" opacity="0.055"/>
  <circle cx="70" cy="448" r="88" fill="#c2703d" opacity="0.04"/>

  <!-- 主视觉：深色圆角方块（与面板头部的品牌锚点同构） -->
  <g transform="translate(256 254)" filter="url(#soft)">
    <rect x="-148" y="-148" width="296" height="296" rx="92" fill="url(#tile)"/>
    <!-- 顶部高光，让方片有材质感 -->
    <rect x="-148" y="-148" width="296" height="150" rx="92" fill="url(#gloss)"/>
    <!-- 官方 octocat mark，居中放大 -->
    <g transform="scale(11.6) translate(-8 -8)">
      <path fill="#fdfaf6" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63 0 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </g>
  </g>

  <!-- 右下角状态点：已就绪（与面板的绿点呼应） -->
  <circle cx="372" cy="370" r="19" fill="#3d9a63" stroke="#fdfbf8" stroke-width="7"/>
</svg>
